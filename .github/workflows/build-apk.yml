name: Build SceneCam APK

on:
  push:
    branches: [main, scenecam]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-24.04 runner image ships with the Android SDK (ANDROID_HOME is preset).
      - name: Point Gradle at the preinstalled Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          # A restored cache once held broken "not found" answers for Maven artifacts; start clean each time.
          cache-disabled: true

      - name: Build APK
        run: |
          set -o pipefail
          R=""; for i in 1 2 3; do gradle assembleDebug --no-daemon $R 2>&1 | tee build.log && break; R=--refresh-dependencies; [ $i = 3 ] && exit 1; echo "Retrying (Maven download hiccup)…"; sleep 20; done

      - name: Report build errors
        if: failure()
        run: |
          enc() { sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"}{print}'; }
          j=$(grep -E "\.java:[0-9]+: error" -A3 build.log | head -60 | enc)
          w=$(grep -A25 "What went wrong" build.log | head -40 | enc)
          [ -n "$j" ] && echo "::error title=Java compile::$j"
          [ -n "$w" ] && echo "::error title=Gradle::$w"
          exit 0

      - name: Rename output
        run: cp app/build/outputs/apk/debug/app-debug.apk SceneCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SceneCam-apk
          path: SceneCam.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete scenecam-latest --yes --cleanup-tag || true
          gh release create scenecam-latest SceneCam.apk --target "$GITHUB_SHA" --latest=false \
            --title "SceneCam (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download SceneCam.apk on your Android phone and install it (allow 'install unknown apps' if asked)."
